# PostgreSQL local para desenvolvimento.
#   docker compose up -d      → sobe o banco
#   docker compose down       → para (os dados ficam no volume)
#   docker compose down -v    → para e apaga os dados
services:
  postgres:
    image: postgres:16
    container_name: sorveteria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sorveteria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - sorveteria-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sorveteria"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sorveteria-pgdata:
