# Roda a cada push/PR: compila o backend em Release e executa os testes.
# O app MAUI (src/GestaoSorveteria.Mobile) fica fora do CI por enquanto: exige o workload
# do .NET MAUI/Android. Compile-o no Visual Studio. (Um job Android pode entrar no Sprint 4.)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar a API
        run: dotnet build src/GestaoSorveteria.Server/GestaoSorveteria.Server.csproj -c Release

      - name: Testar
        # Microsoft Testing Platform (global.json). xUnit v3 gera o TRX com --report-xunit-trx.
        run: dotnet test --project tests/GestaoSorveteria.Tests/GestaoSorveteria.Tests.csproj -c Release --results-directory TestResults --report-xunit-trx --report-xunit-trx-filename resultados.trx

      - name: Anotar testes que falharam
        # Transforma cada teste reprovado em anotação visível na página do run (sem precisar abrir o log).
        if: failure()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          arquivos = glob.glob("**/TestResults/*.trx", recursive=True)
          if not arquivos:
              print("::error title=Testes::Nenhum TRX gerado - falha de compilação ou do runner; veja o log do passo Testar.")
          for arquivo in arquivos:
              for r in ET.parse(arquivo).getroot().iterfind(".//t:UnitTestResult", ns):
                  if r.get("outcome") == "Failed":
                      msg = r.find(".//t:Message", ns)
                      texto = (msg.text or "").strip().replace("\n", " ")[:300] if msg is not None else ""
                      print(f"::error title=Teste falhou::{r.get('testName')} - {texto}")

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: "**/TestResults/*.trx"
