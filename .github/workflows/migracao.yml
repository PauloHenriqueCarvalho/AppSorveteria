# Gera uma migração do EF Core e faz o commit dela na própria branch.
# Para quem não tem o `dotnet ef` à mão — por exemplo, sessões do Claude Code na nuvem, onde o NuGet é bloqueado.
#
# Uso: um commit numa branch feature/** ou fix/** com  [gerar-migracao: NomeEmPascalCase]  na mensagem.
# O workflow gera Persistence/Migrations/<data>_<Nome>.cs + snapshot e faz o commit "feat(infra): migração <Nome> ...".
# Revise o arquivo gerado como manda a skill migracao-ef antes do merge. Commits feitos pelo workflow não disparam o CI:
# o próximo push (qualquer commit) dispara.
name: Gerar migração EF

on:
  push:
    branches: ['feature/**', 'fix/**']

permissions:
  contents: write

concurrency:
  group: migracao-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerar:
    if: contains(github.event.head_commit.message, '[gerar-migracao:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Ler o nome da migração
        id: nome
        env:
          MENSAGEM: ${{ github.event.head_commit.message }}
        run: |
          nome=$(printf '%s' "$MENSAGEM" | grep -oP '\[gerar-migracao:\s*\K[A-Z][A-Za-z0-9]{2,60}(?=\s*\])' | head -n 1 || true)
          if [ -z "$nome" ]; then
            echo "::error title=Migração::Use [gerar-migracao: NomeEmPascalCase] na mensagem do commit."
            exit 1
          fi
          if ls src/GestaoSorveteria.Infrastructure/Persistence/Migrations/*_"$nome".cs >/dev/null 2>&1; then
            echo "::error title=Migração::Já existe uma migração chamada $nome."
            exit 1
          fi
          echo "nome=$nome" >> "$GITHUB_OUTPUT"

      - name: Instalar dotnet-ef (mesma versão do EF Core do projeto)
        run: |
          versao=$(grep -oP 'Include="Microsoft.EntityFrameworkCore.Design" Version="\K[^"]+' src/GestaoSorveteria.Server/GestaoSorveteria.Server.csproj)
          dotnet tool install --global dotnet-ef --version "$versao"

      - name: Gerar a migração
        env:
          NOME: ${{ steps.nome.outputs.nome }}
        run: dotnet ef migrations add "$NOME" -p src/GestaoSorveteria.Infrastructure -s src/GestaoSorveteria.Server -o Persistence/Migrations

      - name: Conferir que o modelo ficou igual às migrações
        # Compila de novo: a migração recém-gerada precisa entrar no assembly.
        run: dotnet ef migrations has-pending-model-changes -p src/GestaoSorveteria.Infrastructure -s src/GestaoSorveteria.Server

      - name: Mostrar o SQL da migração (para revisar no log)
        env:
          NOME: ${{ steps.nome.outputs.nome }}
        run: |
          anterior=$(ls src/GestaoSorveteria.Infrastructure/Persistence/Migrations/*.cs | grep -v -e Designer -e Snapshot -e "_${NOME}.cs" | sort | tail -n 1 | xargs -n1 basename | sed 's/\.cs$//')
          dotnet ef migrations script "$anterior" "$NOME" -p src/GestaoSorveteria.Infrastructure -s src/GestaoSorveteria.Server --no-build

      - name: Fazer o commit na branch
        env:
          NOME: ${{ steps.nome.outputs.nome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GestaoSorveteria.Infrastructure/Persistence/Migrations
          git commit -m "feat(infra): migração $NOME (gerada pelo workflow Gerar migração EF)"
          git push
